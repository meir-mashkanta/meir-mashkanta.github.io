      .withFailureHandler(function () { m.textContent = 'שמירת התבנית נכשלה'; }).saveTemplate(DOC.id, KEY, name);
  });
});
function sendNow_(note, extra) {
  var m = document.getElementById('msg'); m.textContent = 'שולח…';
  google.script.run.withSuccessHandler(function (r) {
    if (r && r.ok) { m.textContent = 'נשלח ל-' + r.to + ' ✓'; return; }
    if (r && r.need && r.need.indexOf(2) >= 0 && !extra) {
      // חסר מייל של לווה 2 – שואלים ושולחים שוב
      var n2 = DOC.n2 || window.prompt('השם של לווה 2:', '') || '';
      var em2 = window.prompt('המייל של ' + (n2 || 'לווה 2') + ' (לשם יישלח הקישור שלו):', DOC.em2 || '');
      if (!em2) { m.textContent = 'לא נשלח – חסר מייל של לווה 2'; return; }
      DOC.n2 = n2; DOC.em2 = em2;
      return sendNow_(note, { n2: n2, em2: em2 });
    }
    m.textContent = (r && r.msg) || 'השליחה נכשלה';
  }).withFailureHandler(function () { m.textContent = 'השליחה נכשלה'; }).sendDoc(DOC.id, KEY, note, extra || null);
}
document.getElementById('send').addEventListener('click', function () {
  if (!sigs.length && !window.confirm('לא סימנת מקומות במסמך. הלקוח יחתום בדף נפרד שיתווסף בסוף המסמך. לשלוח בכל זאת?')) return;
  var note = window.prompt('אפשר להוסיף שורה אישית למייל שיישלח ללקוח (או להשאיר ריק):', ''); if (note === null) return;
  saveNow_(function () { sendNow_(note, null); });
});
// גודל התחלתי לפי סוג המסגרת: חתימה רחבה, שדה טקסט צר, סימון ✓ ריבוע קטן
function newSize_(t, k, r) {
  if (t === 'x') { var q = 0.028; return { w: q, h: q * r.width / r.height }; }
  var sig = t === 'c' || t === 's' || (t === 'a' && (k || 'sig') === 'sig');
  var ww = sig ? sizes[si][1] : Math.max(0.12, sizes[si][1] * 0.8);
  return { w: ww, h: ww * r.width * (sig ? 0.36 : 0.13) / r.height };
}
fetchPdf(DOC.id, function (res) {
  var box = document.getElementById('pages');
  if (!res || !res.pdf) { box.innerHTML = '<div class="spin">המסמך לא נמצא.</div>'; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument({ data: b64bytes(res.pdf), standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/', cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true, disableFontFace: true }).promise.then(function (pdf) {
    box.innerHTML = '';
    var n = 1;
    (function next() {
      if (n > pdf.numPages) { render(); warn_(); return; }
      pdf.getPage(n).then(function (page) {
        var vp = page.getViewport({ scale: renderW_(box) / page.getViewport({ scale: 1 }).width }), idx = n - 1;
        var w = document.createElement('div'); w.className = 'pg';
        var c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        var pn = document.createElement('div'); pn.className = 'pn'; pn.textContent = 'עמוד ' + n;
        w.appendChild(c); w.appendChild(pn); box.appendChild(w); wraps[idx] = w;
        w.addEventListener('click', function (e) {
          // כשמסגרת פתוחה לעריכה – לחיצה על המסמך רק סוגרת אותה
          if (sel) { sel = null; document.getElementById('tool').style.display = 'none'; render(); return; }
          var r = w.getBoundingClientRect(), tv = String(document.getElementById('ntype').value).split(':');
          var sz = newSize_(tv[0], tv[1], r);
          var x = Math.min(1 - sz.w, Math.max(0, (e.clientX - r.left) / r.width - sz.w / 2));
          var y = Math.min(1 - sz.h, Math.max(0, (e.clientY - r.top) / r.height - sz.h / 2));
          var ns = { p: idx, x: x, y: y, w: sz.w, h: sz.h, t: 'c', l: '', v: '' };
          setType_(ns, document.getElementById('ntype').value);
          if (isClient_(ns.t)) ns.b = Number(document.getElementById('nb').value) === 2 ? 2 : 1;
          sigs.push(ns); sel = ns; render(); select_(ns); touch_();
        });
        page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(function () { n++; next(); });
      });
    })();
  }).catch(function () { box.innerHTML = '<div class="spin">לא הצלחנו להציג את המסמך.</div>'; });
}, function (m) { document.getElementById('pages').innerHTML = '<div class="spin">' + (m === 'missing' ? 'הקובץ של המסמך הזה כבר לא שמור.' : 'לא הצלחנו לטעון את המסמך. אפשר לרענן את הדף.') + '</div>'; });
}
